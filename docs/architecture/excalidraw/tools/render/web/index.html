<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; overflow: hidden; }
    #root { display: inline-block; }
    #root svg { display: block; }
  </style>
  <script>
    window.EXCALIDRAW_ASSET_PATH = "/";
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="/bundle.js"></script>
  <script>
    window.renderDiagram = async function (jsonData) {
      try {
        const data = typeof jsonData === "string" ? JSON.parse(jsonData) : jsonData;
        const svg = await window.__exportToSvg({
          elements: data.elements || [],
          appState: {
            ...(data.appState || {}),
            viewBackgroundColor: "#ffffff",
            exportBackground: true,
            exportWithDarkMode: false,
            exportPadding: 60,
          },
          files: data.files || {},
        });
        const root = document.getElementById("root");
        root.innerHTML = "";
        root.appendChild(svg);
        // give embedded <image> data URLs + webfonts a chance to decode
        if (document.fonts && document.fonts.ready) { await document.fonts.ready; }
        window.__renderComplete = true;
        return { success: true, width: svg.getAttribute("width"), height: svg.getAttribute("height") };
      } catch (err) {
        window.__renderComplete = true;
        window.__renderError = String(err && err.message || err);
        return { success: false, error: String(err && err.message || err) };
      }
    };
  </script>
</body>
</html>
