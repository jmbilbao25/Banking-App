<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure banking payment portal for processing e-commerce transactions.">
    <title>{% block title %}PayVault{% endblock %} — PayVault</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="{{ url_for('home') }}" class="nav-brand">
                <span class="nav-logo">◆</span> PayVault
            </a>
            <div class="nav-links">
                <a href="{{ url_for('home') }}">Dashboard</a>
                <a href="{{ url_for('test_qr') }}" style="margin-left:1rem;">Test QR</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 PayVault &mdash; Secure Payment Processing</p>
    </footer>
</body>
</html>
