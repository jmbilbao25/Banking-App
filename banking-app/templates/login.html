<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bahwan CyberBank</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="center-layout">
        <div class="glass-panel" style="width: 100%; max-width: 420px; padding: 2.75rem 2.25rem;">
            <div class="text-center mb-4">
                <div class="brand-logo" style="margin: 0 auto 1rem auto; width: 48px; height: 48px; font-size: 1.25rem;">BC</div>
                <h1 style="font-size: 1.85rem; margin-bottom: 0.25rem;">Bahwan CyberBank</h1>
                <p class="text-muted" style="font-size: 0.9rem;">Sign in to your cyber-banking account</p>
            </div>
            
            {% if error %}
            <div class="error-banner mb-4 text-center">
                <strong>Error:</strong> {{ error }}
            </div>
            {% endif %}
            
            <form method="POST" action="/login">
                <div class="form-group">
                    <label>Account ID</label>
                    <input type="text" name="account_id" class="form-control" required placeholder="e.g., alice-consumer">
                </div>
                
                <div class="form-group mb-4">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required value="password123">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem;">
                    Sign In to Portal
                </button>
            </form>
        </div>
    </div>
</body>
</html>
