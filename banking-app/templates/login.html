<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bahwan CyberBank</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body class="min-h-screen flex items-center justify-center">
    <button class="theme-toggle theme-toggle-absolute" aria-label="Toggle Theme">
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
    <div class="center-layout">
        <div class="glass-panel" style="width: 100%; max-width: 420px; padding: 2.75rem 2.25rem;">
            <div class="text-center mb-4">
                <div class="brand-logo" style="margin: 0 auto 1rem auto; width: 48px; height: 48px; font-size: 1.25rem;">BC</div>
                <h1 style="font-size: 1.85rem; margin-bottom: 0.25rem;">Bahwan CyberBank</h1>
                <p class="text-muted" style="font-size: 0.9rem;">Sign in to your cyber-banking account</p>
            </div>
            
            {% if error %}
            <div class="error-banner mb-4 text-center">
                <strong>Error:</strong> {{ error }}
            </div>
            {% endif %}
            
            <form method="POST" action="/login">
                <div class="form-group">
                    <label>Account ID</label>
                    <input type="text" name="account_id" class="form-control" required placeholder="e.g., alice-consumer">
                </div>
                
                <div class="form-group mb-4">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required value="password123">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem;">
                    Sign In to Portal
                </button>
            </form>
        </div>
    </div>
</body>
</html>
