version: '3.8'

services:
  banking:
    image: jmbilbao25/qr-banking-app:latest
    container_name: banking-app
    ports:
      - "80:80"
    environment:
      - ECOM_CALLBACK_BASE=${ECOM_CALLBACK_BASE:-http://100.59.16.39}
      - DB_HOST=host.docker.internal
      - DB_NAME=${DB_NAME:-bankdb}
      - DB_USER=${DB_USER:-bankuser}
      - DB_PASSWORD=${DB_PASSWORD:-devpass}
      - USE_SQLITE=${USE_SQLITE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - bank-net

networks:
  bank-net:
