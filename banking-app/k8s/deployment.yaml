apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banking-app
  template:
    metadata:
      labels:
        app: banking-app
    spec:
      containers:
      - name: banking-app
        image: myregistry.azurecr.io/banking-app:latest
        ports:
        - containerPort: 5001
        envFrom:
        - secretRef:
            name: db-credentials
        env:
        - name: ECOM_CALLBACK_BASE
          value: "http://ecommerce-app-svc:5000"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 10
