# Reads variables from .env automatically (see .env.example)
services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]              # the ONLY public port
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [banking, ecommerce]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${DB_NAME:-bankdb}
      MYSQL_USER: ${DB_USER:-bankuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-devpass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  banking:
    image: jmbilbao25/qr-banking-app:latest
    expose: ["5001"]             # internal only - reached via nginx
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-bankdb}
      DB_USER: ${DB_USER:-bankuser}
      DB_PASSWORD: ${DB_PASSWORD:-devpass}
      ECOM_CALLBACK_BASE: http://ecommerce:5000
    depends_on:
      mysql: { condition: service_healthy }

  ecommerce:
    image: jmbilbao25/qr-ecommerce-app:latest
    expose: ["5000"]             # internal only - reached via nginx
    environment:
      # URL the phone opens after scanning -> public bank URL on port 80
      # VM_IP comes from .env (dots replaced with dashes, e.g. 20-51-32-10)
      BANK_PUBLIC_BASE: http://bank.${VM_IP:-127-0-0-1}.nip.io
      MERCHANT_ACCOUNT: sweetcrumb-pastries
    depends_on: [banking]

  adminer:            # DEV ONLY - never in Test or Prod
    image: adminer
    ports: ["127.0.0.1:8080:8080"]

volumes:
  mysql_data:
