<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - {{ theme }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="brand-logo" style="margin: 0 auto 1rem auto; width: 48px; height: 48px; font-size: 1.2rem;">TS</div>
            <h2>Create Account</h2>
            <p class="text-muted">Register for {{ theme }}</p>
        </div>
        
        {% if error %}
        <div class="error-banner">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="/register">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required placeholder="Choose a username">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required placeholder="Choose a secure password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block mt-4">Sign Up</button>
        </form>
        
        <div class="text-center mt-4 pt-4" style="border-top: 1px solid var(--surface-border);">
            <p class="text-muted mb-4">Already have an account?</p>
            <a href="/login" class="btn btn-secondary btn-block mb-4">Sign In instead</a>
            <a href="/" class="btn btn-outline btn-block">&larr; Back to Product Catalog</a>
        </div>
    </div>
</body>
</html>
