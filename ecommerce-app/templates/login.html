<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JMB Grocery</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="center-layout">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            
            {% if error %}
            <div class="error-banner">
                {{ error }}
            </div>
            {% endif %}
            
            <form method="POST" action="/login">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="Enter your username">
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block mt-4">Sign In</button>
            </form>
            
            <div class="text-center mt-4 pt-4" style="border-top: 1px solid var(--surface-border);">
                <p class="text-muted mb-4">Don't have an account?</p>
                <a href="/register" class="btn btn-outline btn-block">Create an account</a>
            </div>
        </div>
    </div>
</body>
</html>
